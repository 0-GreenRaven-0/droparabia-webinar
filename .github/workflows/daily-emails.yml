name: Webinar daily emails

# Schedules the day's emails through Brevo. It does not send them itself — it
# hands Brevo a scheduledAt and Brevo fires at the exact minute. That is why the
# cron time below is loose: GitHub's scheduler is best-effort and routinely runs
# several minutes late, which would be fatal for the 20:00 "we're live" email if
# this job were doing the sending.
#
# 05:00 UTC is 07:00 Beirut in winter — comfortably before the earliest slot
# (10:00) and inside Brevo's 72-hour scheduling window for everything due today.

on:
  schedule:
    # Three attempts, not one. GitHub's scheduler is best-effort: the first real
    # run of this workflow fired at 09:35 UTC for a 05:00 cron, 4h35m late, which
    # is after the 10:00 Beirut slot it was meant to schedule. Whole hours on the
    # hour are the most contended, so these sit early and on an odd minute, and
    # the job is idempotent — a stamped cell means done, so later runs do nothing.
    - cron: '23 1 * * *'
    - cron: '23 3 * * *'
    - cron: '23 5 * * *'
  # Manual runs, for the dry run and for recovering a missed day.
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Print the plan without sending or writing anything'
        type: boolean
        default: true

concurrency:
  # Two overlapping runs would both read an unstamped cell and both schedule the
  # same email. One at a time, always.
  group: webinar-daily-emails
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 24 runs the TypeScript the schedule logic lives in without a build step.
          node-version: '24'

      - name: Schedule today's emails
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          GOOGLE_SHEET_WEBINAR: ${{ secrets.GOOGLE_SHEET_WEBINAR }}
          SHEETS_MAILER_ACCOUNT: ${{ secrets.SHEETS_MAILER_ACCOUNT }}
        # On a schedule trigger there are no inputs, so this expands to
        # [ "" = "true" ] and takes the live branch — which is what the nightly
        # run wants. Only a manual dispatch with the box ticked goes dry.
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            node scripts/send-daily.mjs --dry-run
          else
            node scripts/send-daily.mjs
          fi
